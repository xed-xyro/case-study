<!DOCTYPE html>
<html>
	<head> 
		<title>Joey's Restaurant Cafe</title>
		<link rel="icon" type="image/icon" href="images/joey'slogo.jpg">
		<link rel="stylesheet" type="text/css" href="joeys.css">
	</head>
	<body>
		<div class="nav-box">
			<nav>
				<a href="index.html">Home</a>
				<a href="menu.html">Menu</a>
				<a href="about.html">About</a>
				<a href="contact.html">Contact</a>
				<form action="#" method="POST" class="search-bar">
					<input type="search" placeholder="Search                   🔍">
				</form>
				<a href="https://www.foodpanda.ph/restaurant/b6ho/joeys-restaurant-cafe-general-luna-street" target="_blank" rel="noopener noreferrer" class="order-btn">Order Now!</a>
			</nav>
		</div>
        <h1>🍜 Joey's Restaurant Café</h1>
        <div class="container">
            <div class="summary" id="summary"></div>
            <div class="controls">
                <div class="filters" id="filters"></div>
                <button class="add-review-toggle" id="toggleFormBtn">+ Write a review</button>
            </div>

        <form id="reviewForm">
            <div class="add-review-form" id="addForm">
                <h3>Share your experience</h3>
                <div class="form-row">
                    <div class="field">
                        <label for="nameInput">Your name</label>
                        <input type="text" id="nameInput" placeholder="Enter your name" required>
                    </div>
                    <div class="field">
                        <label for="dishInput">Dish you tried (optional)</label>
                        <input type="text" id="dishInput" placeholder="Example: Pancit Palabok">
                    </div>
                </div>
                <div class="form-row">
                    <span class="rating-label">Rating:</span>
                    <div class="star-picker" id="starPicker">
                        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
                    </div>
                </div>
                <div class="field">
                    <label for="textInput">Your review</label>
                    <textarea id="textInput" placeholder="What did you think of the food, service, and atmosphere?" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitReviewBtn">Post review</button>
            </div>
        </form>
            <p id="thankYouMsg" style="color: green; font-weight: bold; font-size: 1.1rem;"></p>
            <div class="review-list" id="reviewList"></div>
            <div class="empty-state" id="emptyState" style="display:none;">No reviews match this filter yet.</div>
        </div>
        <footer>Joey's Restaurant Café &middot; 39 General Luna Street, Cabanatuan City, 3100 Nueva Ecija</footer>
        <script src="script.js"></script>
	</body>
</html>
